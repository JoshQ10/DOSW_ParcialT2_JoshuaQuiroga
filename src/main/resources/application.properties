spring.application.name=DOSW-ParcialT2

# Base de Datos - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/dosw_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.servlet.context-path=/api
server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# JWT
app.jwt.secret=DOSW_ParcialT2_SecureSecretKeyForJWTToken_2024_2025_MustBeAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration=86400000
app.jwt.refresh-token-expiration=604800000

# Logging
logging.level.root=INFO
logging.level.edu.dosw.parcial=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

